# Optional static-site Render blueprint for the React frontend.
# Set VITE_API_BASE to https://<api-service>.onrender.com/campuskart and
# VITE_UPLOAD_BASE to https://<api-service>.onrender.com in the dashboard.
services:
  - type: web
    name: campuskart-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_UPLOAD_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
